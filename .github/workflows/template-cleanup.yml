# In a repository created with "Use this template", points the README links to the
# copy's own GitHub Pages site. It changes the files only while they still hold the
# template's address, so later runs do nothing.
name: template-cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository != 'rodbv/python-slides-template'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Point the README links to this repository's site
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          # A repository named OWNER.github.io is served at the root of the domain.
          if [ "${repo,,}" = "$owner.github.io" ]; then
            site="https://$owner.github.io"
          else
            site="https://$owner.github.io/$repo"
          fi
          files=$(grep -l "https://rodbv.github.io/python-slides-template" README*.md || true)
          if [ -z "$files" ]; then
            echo "The README links already point to this repository."
            exit 0
          fi
          sed -i "s|https://rodbv.github.io/python-slides-template|$site|g" $files
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs(readme): point the links to $site"
          git push
